<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>EasyDay — Routine & Tasks</title>

    <meta
            name="description"
            content="EasyDay vous aide à organiser vos tâches, routines et listes partagées pour alléger votre charge mentale."
    />

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f7f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 64px 24px 40px;
        }

        .hero {
            text-align: center;
            background: #ffffff;
            border-radius: 28px;
            padding: 56px 32px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.07);
        }

        h1 {
            margin: 0;
            color: #7c3aed;
            font-size: 3rem;
        }

        .tagline {
            margin: 16px auto 0;
            max-width: 620px;
            color: #6b7280;
            font-size: 1.2rem;
            line-height: 1.6;
        }

        .features {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 28px;
        }

        .feature {
            background: #f3f0ff;
            color: #6d28d9;
            border-radius: 999px;
            padding: 10px 16px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 36px;
        }

        .button {
            display: inline-block;
            padding: 15px 22px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 700;
            transition: transform 0.15s ease;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .primary {
            background: #7c3aed;
            color: white;
        }

        .secondary {
            background: #ede9fe;
            color: #6d28d9;
        }

        .links {
            margin-top: 32px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 18px;
        }

        .links a {
            color: #6b7280;
            text-decoration: none;
        }

        .links a:hover {
            color: #7c3aed;
        }

        footer {
            text-align: center;
            margin-top: 32px;
            color: #9ca3af;
            font-size: 0.85rem;
        }

        @media (max-width: 600px) {
            .container {
                padding: 28px 16px;
            }

            .hero {
                padding: 40px 20px;
            }

            h1 {
                font-size: 2.3rem;
            }

            .tagline {
                font-size: 1rem;
            }

            .buttons {
                flex-direction: column;
            }

            .button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<main class="container">

    <section class="hero">

        <h1>EasyDay</h1>

        <p class="tagline">
            Moins de charge mentale, plus de place pour ce qui compte.
            Organisez vos tâches, vos routines et vos listes partagées simplement.
        </p>

        <div class="features">
            <span class="feature">✓ Tâches</span>
            <span class="feature">✓ Routines</span>
            <span class="feature">✓ Listes partagées</span>
            <span class="feature">✓ Rappels</span>
        </div>

        <div class="buttons">

            <a
                    class="button primary"
                    href="https://apps.apple.com/fr/app/easyday-routine-tasks/id6785937721"
                    target="_blank"
                    rel="noopener noreferrer"
            >
                Télécharger sur l’App Store
            </a>

            <a
                    class="button primary"
                    href="https://play.google.com/store/apps/details?id=com.captngeek.easyday"
                    target="_blank"
                    rel="noopener noreferrer"
            >
                Télécharger sur Google Play
            </a>

        </div>

        <div class="links">

            <a href="./help/">
                Aide
            </a>

            <a href="./privacy/">
                Confidentialité
            </a>
        </div>

    </section>

    <footer>
        EasyDay — Routine & Tasks
    </footer>

</main>

</body>
</html>
